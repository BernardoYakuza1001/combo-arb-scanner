name: mexc-paper
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mexc-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python carry/test_mexc_paper.py
      - run: python -u carry/mexc_paper.py
      - name: Save state
        if: always()
        run: |
          git config user.name "combo-arb-bot"
          git config user.email "combo-arb-bot@users.noreply.github.com"
          git add data/mexc_paper || true
          git commit -m "mexc paper: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
