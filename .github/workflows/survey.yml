name: survey
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["combo_arb/**", "config.json"]
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python tests/test_combo.py
      - run: python -u -m combo_arb survey
