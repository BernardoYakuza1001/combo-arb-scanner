name: pmmm
on:
  workflow_dispatch:
    inputs:
      hours: {default: "5.75"}
      n: {default: "12"}
      cap: {default: "200"}
  push:
    paths: ["pmmm/**", ".github/workflows/pmmm.yml"]
  schedule:
    - cron: "3 */6 * * *"
concurrency: {group: pmmm, cancel-in-progress: true}
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests pytest
      - run: python -m pytest -q pmmm/test_bot.py
      - name: Paper run (commits SUMMARY every 15 min)
        env:
          PMMM_RUN_S: ${{ github.event.inputs.hours && format('{0}', github.event.inputs.hours) || '5.75' }}
          PMMM_N: ${{ github.event.inputs.n || '12' }}
          PMMM_CAP: ${{ github.event.inputs.cap || '200' }}
        run: |
          export PMMM_RUN_S=$(python -c "print(int(float('$PMMM_RUN_S')*3600))")
          export PMMM_OUT=data/pmmm/$(date -u +%Y%m%dT%H%M)
          git config user.name "combo-arb-bot"; git config user.email "combo-arb-bot@users.noreply.github.com"
          ( sleep 60; while sleep 300; do git add data/pmmm data/edges 2>/dev/null; git commit -qm "pmmm: progress" && for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push -q && break; sleep 5; done; done ) &
          python -u pmmm/bot.py
          git add data/pmmm data/edges; git commit -qm "pmmm: final" || true
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
