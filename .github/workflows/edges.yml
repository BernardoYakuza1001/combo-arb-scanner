name: edges
on:
  workflow_dispatch: {}
  push:
    paths: ["edges/**", ".github/workflows/edges.yml"]
  schedule:
    - cron: "41 */3 * * *"
permissions:
  contents: write
jobs:
  edges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: timeout 600 python -u edges/funding_xv.py
        continue-on-error: true
      - run: timeout 600 python -u edges/pm_rewards.py
        continue-on-error: true
      - name: Save results
        if: always()
        run: |
          git config user.name "combo-arb-bot"
          git config user.email "combo-arb-bot@users.noreply.github.com"
          git add data/edges || true
          git commit -m "edges: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
