name: probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://api.bybit.com/v5/market/time" "https://api.bytick.com/v5/market/time" "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=2"; do
            echo "== $u"; curl -sS -m 20 -o /tmp/r -w "HTTP %{http_code}\n" "$u"; head -c 300 /tmp/r; echo
          done
