name: probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=2" \
                   "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=BTC_USDT&limit=2" \
                   "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=usdt-futures&pageSize=2" \
                   "https://api-futures.kucoin.com/api/v1/contract/funding-rates?symbol=XBTUSDTM&from=1793000000000&to=1793100000000" \
                   "https://contract.mexc.com/api/v1/contract/funding_rate/history?symbol=BTC_USDT&page_size=2" \
                   "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2"; do
            echo "== $u"; curl -sS -m 20 -o /tmp/r -w "HTTP %{http_code}\n" "$u"; head -c 250 /tmp/r; echo
          done
          echo "== hyperliquid"; curl -sS -m 20 -X POST https://api.hyperliquid.xyz/info -H 'Content-Type: application/json' -d '{"type":"fundingHistory","coin":"BTC","startTime":1793000000000}' -o /tmp/r -w "HTTP %{http_code}\n"; head -c 250 /tmp/r; echo
