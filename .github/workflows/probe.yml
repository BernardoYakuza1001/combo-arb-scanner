name: probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS -m 20 "https://contract.mexc.com/api/v1/contract/funding_rate/history?symbol=AAVE_USDT&page_size=1000&page_num=1" -o /tmp/r -w "HTTP %{http_code}\n"
          python3 -c "
          import json,datetime as D;d=json.load(open('/tmp/r'))['data'];l=d['resultList'];print('total',d['totalCount'],'pages',d['totalPage'],'got',len(l));t=[x['settleTime'] for x in l];print('span',D.datetime.utcfromtimestamp(min(t)/1000),D.datetime.utcfromtimestamp(max(t)/1000))"
          curl -sS -m 30 "https://contract.mexc.com/api/v1/contract/detail" -o /tmp/c -w "HTTP %{http_code}\n"
          python3 -c "
          import json;d=json.load(open('/tmp/c'))['data'];u=[x for x in d if x.get('quoteCoin')=='USDT' and x.get('state')==0];print('usdt perps live',len(u))"
          curl -sS -m 30 "https://api.mexc.com/api/v3/exchangeInfo" -o /tmp/s -w "HTTP %{http_code}\n"
          python3 -c "
          import json;d=json.load(open('/tmp/s'));s=[x for x in d['symbols'] if x.get('quoteAsset')=='USDT' and str(x.get('status'))in('1','ENABLED','TRADING')];print('spot usdt',len(s))"
