name: probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=AAVE_USDT&limit=1000&from=1768664737&to=1794584737" \
                   "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=AAVE_USDT&limit=1000"; do
            echo "== $u"; curl -sS -m 20 -o /tmp/r -w "HTTP %{http_code}\n" "$u"; head -c 300 /tmp/r; echo; python3 -c "import json;d=json.load(open('/tmp/r'));print('rows',len(d) if isinstance(d,list) else d)"
          done
          curl -sS https://api.gateio.ws/api/v4/futures/usdt/contracts -o /tmp/c; python3 -c "import json;d=json.load(open('/tmp/c'));print('contracts',len(d))"
