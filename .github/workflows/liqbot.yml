name: liqbot-build
on:
  workflow_dispatch: {}
  push:
    paths: ["liqbot/**", ".github/workflows/liqbot.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: {run: {working-directory: liqbot}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - name: Dry start on Base (dummy unfunded key, 60 s) - shows how many markets/positions it watches
        run: |
          export RPC_URL_8453=https://base-rpc.publicnode.com EXECUTOR_ADDRESS_8453=0x0000000000000000000000000000000000000001
          export LIQUIDATION_PRIVATE_KEY_8453=0x$(printf '1%.0s' {1..64})
          timeout 90 npx tsx apps/client/src/script.ts 2>&1 | tail -40 || true
